site_name: Fabric IQ Learn Tracker
site_description: "What's new" and searchable history for the Microsoft Fabric IQ docs on Microsoft Learn
site_url: https://david-pizzi-msft.github.io/fabric-iq-learn-tracker/
repo_url: https://github.com/david-pizzi-msft/fabric-iq-learn-tracker
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [navigation.top, navigation.sections, search.suggest, search.highlight, content.code.copy]
plugins:
  - search
markdown_extensions:
  - admonition
  - toc: {permalink: true}
not_in_nav: |
  /snapshots/
nav:
  - What's new: index.md
  - Archive: reports/index.md
